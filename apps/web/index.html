<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure MNC — Lunar South Pole</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app">
    <div class="terminal-card">
      <div class="badge">MNC TELEMETRY RELAY • SECTOR 04</div>
      <h1>ADVENTURE MNC</h1>
      <p class="sub">SHACKLETON CRATER RIM • 89.9°S</p>
      <div class="status-grid">
        <div class="status-item">
          <span class="label">PHASE</span>
          <span class="val">MILESTONE 0 (FOUNDATION)</span>
        </div>
        <div class="status-item">
          <span class="label">GRAVITY</span>
          <span class="val">1.625 m/s²</span>
        </div>
        <div class="status-item">
          <span class="label">ATMOSPHERE</span>
          <span class="val">VACUUM (0.00 kPa)</span>
        </div>
        <div class="status-item">
          <span class="label">SECURITY ALERT</span>
          <span class="val">LEVEL 0 (INACTIVE)</span>
        </div>
      </div>
      <p class="note">Foundation verified. Engine and renderer pipelines initializing for M1.</p>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
